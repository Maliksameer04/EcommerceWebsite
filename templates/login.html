<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEase</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                ShopEase
            </div>

            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Cart 🛒</a></li>
                <li><a href="/login">Login</a></li>
                <li><a href="/register">Register</a></li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="auth-section">

            <div class="auth-container">

                <h1>Welcome Back</h1>

                <p class="auth-subtitle">
                    Login to your ShopEase account.
                </p>

                <form method="POST">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button type="submit">
                        Login
                    </button>

                </form>

                <p class="auth-footer">
                    Don't have an account?
                    <a href="/register">Create Account</a>
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 ShopEase. All rights reserved.
        </p>

    </footer>

</body>

</html>
